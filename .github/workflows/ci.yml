name: CI

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Run tests
        run: bun run test

  build-desktop-artifacts:
    if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: release:appimage
            artifact_prefix: lanodus-linux
          - os: macos-15-intel
            script: release:mac:x64
            artifact_prefix: lanodus-macos-x64
          - os: macos-15
            script: release:mac:arm64
            artifact_prefix: lanodus-macos-arm64
          - os: windows-latest
            script: release:win:x64
            artifact_prefix: lanodus-windows-x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run ${{ matrix.script }}

      - name: Build safe artifact name suffix
        shell: pwsh
        run: |
          $safeRef = $env:GITHUB_REF_NAME -replace '/', '-'
          "SAFE_REF_NAME=$safeRef" >> $env:GITHUB_ENV

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_prefix }}-${{ env.SAFE_REF_NAME }}
          path: release/**
          if-no-files-found: error
