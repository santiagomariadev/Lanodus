name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Run tests
        run: bun run test

  build-appimage:
    if: startsWith(github.ref, 'refs/heads/release/')
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build AppImage
        run: bun run release:appimage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanodus-${{ github.ref_name }}
          path: release/*.AppImage
          if-no-files-found: error
